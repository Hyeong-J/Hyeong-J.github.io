theme: jekyll-theme-chirpy

lang: ko-KR
timezone: Asia/Seoul

title: Hyeong-J's Dev & Work Log
tagline: 하루 동안 작업한 코드와 배운 내용을 정리하는 공간입니다.
description: >-
  하루동안 제가 일한거나, 배워서 직접 작성해본 코드 결과물과 배운 내용을 카테고리/날짜별로 정리하는 블로그입니다.

url: "https://hyeong-j.github.io"

github:
  username: Hyeong-J

social:
  name: Hyeong-J
  email: ignis8372@gmail.com
  links:
    - https://github.com/Hyeong-J

paginate: 10

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
  - scope:
      path: _tabs
    values:
      layout: page
      dynamic_title: true
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - "*.config.js"
  - package*.json
